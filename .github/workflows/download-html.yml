name: Download Goa Online HTML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Download Goa Online HTML
        run: python scraper/download_goa_online_html.py

      - name: Upload captured files
        uses: actions/upload-artifact@v4
        with:
          name: goa-online-html-debug
          path: output/
          retention-days: 7
