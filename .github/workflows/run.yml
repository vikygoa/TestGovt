name: Goa Schemes Real Page Test v5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run real scheme-page test
        run: python scraper/run.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goa-schemes-real-page-v5
          path: output/
          retention-days: 7
